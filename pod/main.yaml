apiVersion: v1
kind: Pod
metadata:
  name: weather-api-pod
  namespace: lab-devops
  labels:
    app: weather-api
spec:
  containers:
    - name: weather-api
      image: erickveiga/weather-api:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: OPENWEATHER_API_KEY
          value: "SUA_API_KEY_AQUI"
